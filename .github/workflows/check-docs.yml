name: Check docs assets

# GitHub Pages는 main 브랜치의 /docs를 직접 서빙한다 (Pages source: main + /docs, build_type: legacy).
# 즉 docs/의 자산 참조가 어긋난 채 main에 push되면 그 순간 웹 앱이 404로 깨진다.
# v1.17.7(36acadb)이 실제로 이 상태로 배포됐다. (SAMPL-2-22)
#
# ⚠️ 이 워크플로는 "게이트"가 아니라 "사후 경보기"다.
#    - main 브랜치 보호가 설정돼 있지 않고(gh api .../branches/main/protection → 404),
#      PR 이력이 0건이라 pull_request 트리거는 사실상 발동하지 않는다.
#    - legacy Pages 빌드는 Actions와 무관하게 병렬로 배포되므로, push가 수락된 뒤 도는
#      이 잡은 배포 자체를 막을 수 없다.
#    실제 차단 게이트는 .githooks/pre-push 이며, 이 잡은 훅이 우회(--no-verify)되거나
#    core.hooksPath 미설정으로 동작하지 않았을 때를 잡는 2차 그물이다.
#    진짜 게이트로 승격하려면 main 브랜치 보호 + required status check 등록이 필요하다.
#
# build.yml은 태그에서만 돌고 Pages와 무관하므로 이 검사의 위치가 아니다.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-docs-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 의존성 설치 불필요 — 검사 스크립트는 node 기본 API만 사용한다.
      # 체크아웃된 커밋 트리를 검사하므로 Pages가 서빙할 내용과 동일하다.
      - name: docs/ 자산 참조 정합성 검사
        run: node scripts/check-docs-assets.js
