name: Check docs assets

# GitHub Pages는 main 브랜치의 /docs를 직접 서빙한다 (Pages source: main + /docs, build_type: legacy).
# 즉 docs/의 자산 참조가 어긋난 채 main에 push되면 그 순간 웹 앱이 404로 깨진다.
# v1.17.7(36acadb)이 실제로 이 상태로 배포됐다. (SAMPL-2-22)
#
# 이 잡은 required status check다 (SAMPL-2-23에서 브랜치 보호 적용, SAMPL-2-24에서 typecheck 추가).
#    main 브랜치 보호: contexts = [check-docs-assets, typecheck], strict: true, enforce_admins: true
#    → main 직접 푸시가 거부되고, 이 검사를 통과한 PR만 머지된다. --no-verify로 우회할 수 없다.
#    (그 전까지는 브랜치 보호가 없어 push 수락 후에 도는 사후 경보기였다.)
#    로컬 .githooks/pre-push도 같은 검사를 수행해 푸시 전에 먼저 알려준다.
#
# build.yml은 태그에서만 돌고 Pages와 무관하므로 이 검사의 위치가 아니다.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-docs-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 의존성 설치 불필요 — 검사 스크립트는 node 기본 API만 사용한다.
      # 체크아웃된 커밋 트리를 검사하므로 Pages가 서빙할 내용과 동일하다.
      - name: docs/ 자산 참조 정합성 검사
        run: node scripts/check-docs-assets.js
