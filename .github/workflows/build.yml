name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Clean npm cache
        run: npm cache clean --force

      - name: Install dependencies
        run: npm install

      - name: Create network-config with secrets
        run: |
          @"
          window.NETWORK_CONFIG = {
              ALLOWED_GATEWAY: '${{ secrets.ALLOWED_GATEWAY }}'
          };
          "@ | Out-File -FilePath "src/shared/network-config.js" -Encoding utf8
        shell: pwsh

      # SAMPL-1-49: main process가 사용하는 .env 파일을 secrets에서 생성
      # forge.config.js의 extraResource로 패키지의 resources/에 동봉됨
      - name: Create .env with secrets
        run: |
          @"
          JUSO_API_KEY=${{ secrets.JUSO_API_KEY }}
          VWORLD_API_KEY=${{ secrets.VWORLD_API_KEY }}
          FOODSAFETY_API_KEY=${{ secrets.FOODSAFETY_API_KEY }}
          RDA_PSIS_API_KEY=${{ secrets.RDA_PSIS_API_KEY }}
          "@ | Out-File -FilePath ".env" -Encoding utf8 -NoNewline
        shell: pwsh

      - name: Build Windows package
        run: npm run make

      - name: Create latest.yml for auto-updater
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $exeFile = Get-ChildItem -Path "out/make/squirrel.windows/x64" -Filter "*Setup.exe" | Select-Object -First 1
          $exeSize = $exeFile.Length
          $exeHash = (Get-FileHash -Path $exeFile.FullName -Algorithm SHA512).Hash.ToLower()
          $content = @"
          version: $version
          files:
            - url: $($exeFile.Name)
              sha512: $exeHash
              size: $exeSize
          path: $($exeFile.Name)
          sha512: $exeHash
          releaseDate: $(Get-Date -Format "yyyy-MM-ddTHH:mm:ss.fffZ")
          "@
          $content | Out-File -FilePath "out/make/squirrel.windows/x64/latest.yml" -Encoding utf8
        shell: pwsh

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: out/make/**/*

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            out/make/squirrel.windows/x64/*.exe
            out/make/squirrel.windows/x64/*.nupkg
            out/make/squirrel.windows/x64/RELEASES
            out/make/squirrel.windows/x64/latest.yml
          draft: false
          prerelease: false
          # 본문이 비어 있으면 자동업데이트 알림으로 이 페이지에 온 사용자가
          # 무엇이 바뀌었는지 알 수 없다. 담당자용 안내 + 커밋 기반 자동 노트를 함께 넣는다. (SAMPL-2-23)
          body: |
            ### 설치 / 업데이트

            `sample-log-setup.exe` 를 실행하면 설치와 업데이트가 진행됩니다.
            이미 설치된 앱은 실행 시 자동으로 이 버전으로 업데이트됩니다.

            ### 변경 내용

            사용자용 변경 내용은 앱 안의 **릴리즈 노트** 화면에서 보실 수 있습니다.
            웹에서는 https://bluesky78060.github.io/sample-log-electron/release/ 에서 확인하실 수 있습니다.
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
