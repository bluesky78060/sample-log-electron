name: Typecheck

# `npm run typecheck`(tsc --noEmit)는 tsconfig.json이 없던 동안 도움말만 출력하고
# exit 0 하는 위장 게이트였다. SAMPL-2-24에서 tsconfig.json + types/globals.d.ts를 넣어
# 실제로 검사하게 만들었고, 이 잡이 그것을 main 도달 전에 강제한다.
#
# checkJs: false 이므로 `// @ts-check`가 붙은 파일만 검사한다.
# 새 파일·수정 파일에 한 줄 추가하면 게이트 범위가 점진적으로 넓어진다.
# (전체 검사는 오류 2654건이라 게이트로 쓸 수 없다 — tsconfig.json 주석 참조)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: typecheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # build.yml(릴리스 빌드)과 같은 메이저를 쓴다 — 검증 런타임과 배포 런타임을 맞춘다
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm ci로 lock을 그대로 재현한다 (SAMPL-2-25에서 lock을 크로스플랫폼으로 재생성).
      # 게이트 도구가 부동 버전이면 TS 마이너 릴리스 하나로 아무 잘못 없는 PR이 전부 막힌다
      # (enforce_admins: true라 우회 수단도 없다). typescript·@playwright/test는
      # 캐럿을 떼고 정확 버전으로 고정했다 — @playwright/test는 캐시된 브라우저 바이너리와
      # 짝이 맞아야 하므로 특히 중요하다.
      - name: 의존성 설치
        run: npm ci --no-audit --no-fund

      # include 오타·경로 이동으로 프로그램이 0파일이 되면 tsc는 다시 조용히 exit 0 한다
      # — 이 티켓이 고친 바로 그 실패 양식이다. 검사 대상 수를 확인해 자기검사한다.
      #
      # ⚠️ SAMPL-2-25에서 프로젝트를 node/browser로 나눴다. 루트 tsconfig.json은 이제
      #    references만 들고 **파일이 0개**이므로, 여기서 루트를 가리키면 자기검사가
      #    항상 0을 세어 실패한다. 각 자식 프로젝트를 직접 확인해야 한다.
      - name: 게이트 실효성 확인 (검사 대상이 비면 실패)
        run: |
          n=$(npx tsc -p tsconfig.node.json --noEmit --listFilesOnly | grep -c 'tests/e2e/.*\.spec\.js')
          echo "node 프로젝트 — 검사 대상 spec 파일: $n"
          if [ "$n" -lt 20 ]; then
            echo "::error::spec 검사 대상이 $n개로 줄었습니다. tsconfig.node.json include를 확인하세요."
            exit 1
          fi

          b=$(npx tsc -p tsconfig.browser.json --noEmit --listFilesOnly | grep -c '^.*src/.*\.js$')
          echo "browser 프로젝트 — 검사 대상 src 파일: $b"
          if [ "$b" -lt 50 ]; then
            echo "::error::브라우저 검사 대상이 $b개로 줄었습니다. tsconfig.browser.json include를 확인하세요."
            exit 1
          fi

      # ⚠️ 위 검사는 "파일이 프로그램에 들어왔는가"만 센다. checkJs가 false라
      #    **실제 검사는 `// @ts-check`가 붙은 파일에만** 일어나므로, 누군가 그
      #    주석을 전부 떼도 파일 수는 그대로여서 위 검사는 통과한다(독립 리뷰 MAJOR).
      #    실제 opt-in 파일 수를 따로 센다.
      - name: '@ts-check opt-in 파일이 줄지 않았는지 확인'
        run: |
          # 임계값은 **현재 수와 같게** 둔다. 여유를 두면 한두 개가 조용히 빠져도
          #    통과한다 — 게이트 범위는 넓어지기만 해야 하고, 넓어지면 이 숫자도 올린다.
          n=$(grep -rl '@ts-check' src/ | wc -l | tr -d ' ')
          echo "src/의 @ts-check 파일: $n (기준 10)"
          if [ "$n" -lt 10 ]; then
            echo "::error::@ts-check 파일이 $n개로 줄었습니다. 검사 범위가 후퇴했습니다."
            exit 1
          fi

      # 브라우저 프로젝트에 @types/node가 새어 들어오면 process·Buffer·__dirname이
      # 그대로 통과해 이 앱의 중심 불변식(Electron vs Web)을 게이트가 못 잡는다.
      # jszip의 `/// <reference types="node" />`가 실제로 그렇게 만들었다
      # (types/stubs/jszip.d.ts 참조). 다른 의존성이 같은 짓을 하면 조용히 재발한다.
      #
      # ⚠️ 임계값은 **0**이다. 몇 개만 들어와도 그 안에 process·Buffer 선언이 있으면
      #    검사가 무력해진다 — "조금 새는 것"은 안전하지 않다(독립 리뷰 MAJOR).
      - name: 브라우저 프로젝트에 Node 타입이 새지 않는지 확인
        run: |
          n=$(npx tsc -p tsconfig.browser.json --noEmit --listFiles | grep -c '@types/node' || true)
          echo "browser 프로젝트의 @types/node 파일 수: $n"
          if [ "$n" -gt 0 ]; then
            echo "::error::@types/node가 브라우저 프로젝트에 새어 들어왔습니다($n개). --explainFiles로 어떤 의존성이 끌어오는지 확인하세요."
            exit 1
          fi

      # 🚨 여기가 이 워크플로의 핵심이다. 위 검사들은 전부 **간접 지표**이고,
      #    지표는 진짜 게이트가 죽어도 초록불일 수 있다 — SAMPL-2-24의 위장 게이트가
      #    정확히 그랬다. 그래서 **일부러 깨진 파일을 넣어 게이트가 실제로 잡는지**
      #    확인한다. 잡지 못하면 그 순간 CI를 실패시킨다.
      - name: 게이트가 실제로 Node 전역 누수를 잡는지 실증 (변이 검증)
        run: |
          # ⚠️ 고정 파일명을 쓰지 않는다. 같은 이름의 실제 소스가 생기면
          #    `cat >`가 그것을 덮어쓰고 `rm -f`가 지워버린다 — CI가 소스를 파괴하면서
          #    통과할 수 있다(독립 리뷰 2라운드 MAJOR). 고유 이름을 만들어 쓴다.
          probe="src/shared/__gate_probe_$(date +%s%N)__.js"
          # ⚠️ 만들자마자 trap을 건다. 중간에 셸이 죽거나 취소돼도 소스 트리에
          #    프로브가 남지 않아야 한다.
          trap 'rm -f "$probe"' EXIT
          cat > "$probe" <<'PROBE'
          // @ts-check
          export function probe() {
              return process.platform + String(Buffer.from('x')) + __dirname;
          }
          PROBE
          set +e
          npx tsc -p tsconfig.browser.json --noEmit > /tmp/probe.log 2>&1
          code=$?
          set -e
          cat /tmp/probe.log
          if [ "$code" -eq 0 ]; then
            echo "::error::브라우저 코드에서 process·Buffer·__dirname을 써도 통과했습니다 — 게이트가 죽어 있습니다."
            exit 1
          fi
          echo "게이트 정상: 누수 프로브를 잡았습니다 (exit $code)"

      - name: 타입 검사
        run: npm run typecheck
