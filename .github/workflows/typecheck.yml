name: Typecheck

# `npm run typecheck`(tsc --noEmit)는 tsconfig.json이 없던 동안 도움말만 출력하고
# exit 0 하는 위장 게이트였다. SAMPL-2-24에서 tsconfig.json + types/globals.d.ts를 넣어
# 실제로 검사하게 만들었고, 이 잡이 그것을 main 도달 전에 강제한다.
#
# checkJs: false 이므로 `// @ts-check`가 붙은 파일만 검사한다.
# 새 파일·수정 파일에 한 줄 추가하면 게이트 범위가 점진적으로 넓어진다.
# (전체 검사는 오류 2654건이라 게이트로 쓸 수 없다 — tsconfig.json 주석 참조)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: typecheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # build.yml과 같은 방식(npm install)을 쓴다. npm ci는 이 저장소에서 실패한 이력이 있다.
      - name: 의존성 설치
        run: npm install --no-audit --no-fund

      - name: 타입 검사
        run: npm run typecheck
