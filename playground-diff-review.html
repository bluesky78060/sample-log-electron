<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diff Review / Code Review Playground</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #1a1a2e;
  --panel: #16213e;
  --panel-hover: #1a2744;
  --border: #2a3a5c;
  --accent: #e94560;
  --accent-hover: #ff6b81;
  --blue: #4fc3f7;
  --green: #66bb6a;
  --yellow: #ffd54f;
  --orange: #ffb74d;
  --purple: #ce93d8;
  --pink: #f48fb1;
  --text: #e0e0e0;
  --text-dim: #8892a4;
  --text-bright: #ffffff;
  --input-bg: #0f1629;
  --chip-bg: #2a3a5c;
  --chip-active: #e94560;
  --radius: 8px;
  --radius-sm: 4px;
  --shadow: 0 2px 8px rgba(0,0,0,0.3);
  --transition: 0.2s ease;
  --diff-add-bg: rgba(102,187,106,0.08);
  --diff-add-border: rgba(102,187,106,0.25);
  --diff-del-bg: rgba(233,69,96,0.08);
  --diff-del-border: rgba(233,69,96,0.25);
  --diff-hunk-bg: rgba(79,195,247,0.06);
  --diff-hunk-border: rgba(79,195,247,0.2);
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  overflow: hidden;
}

.app {
  display: flex;
  height: 100vh;
}

/* ========== LEFT PANEL ========== */
.left-panel {
  width: 320px;
  min-width: 280px;
  background: var(--panel);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

/* ========== RIGHT PANEL ========== */
.right-panel {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.diff-panel {
  flex: 1;
  min-height: 200px;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  padding: 20px;
  overflow-y: auto;
}

.prompt-output {
  height: 220px;
  min-height: 150px;
  background: var(--panel);
  padding: 20px;
  overflow-y: auto;
  flex-shrink: 0;
}

/* ========== HEADER ========== */
.app-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border);
}

.app-header h1 {
  font-size: 18px;
  font-weight: 700;
  color: var(--text-bright);
}

.app-header .subtitle {
  font-size: 12px;
  color: var(--text-dim);
}

/* ========== SECTION (collapsible) ========== */
.section {
  background: var(--input-bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  transition: border-color var(--transition);
}

.section:hover {
  border-color: #3a4a6c;
}

.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 14px;
  cursor: pointer;
  user-select: none;
  background: rgba(255,255,255,0.02);
  position: relative;
}

.section-header:hover {
  background: rgba(255,255,255,0.04);
}

.section-header::before {
  content: '';
  display: inline-block;
  width: 0;
  height: 0;
  border-left: 5px solid var(--text-dim);
  border-top: 4px solid transparent;
  border-bottom: 4px solid transparent;
  margin-right: 8px;
  transition: transform var(--transition);
  flex-shrink: 0;
}

.section:not(.collapsed) .section-header::before {
  transform: rotate(90deg);
}

.section-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--blue);
  display: flex;
  align-items: center;
  gap: 8px;
}

.section-title .keyword {
  background: rgba(79,195,247,0.15);
  color: var(--blue);
  padding: 2px 8px;
  border-radius: var(--radius-sm);
  font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', monospace;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.5px;
}

.section-badge {
  font-size: 11px;
  color: var(--text-dim);
  background: var(--chip-bg);
  padding: 2px 8px;
  border-radius: 10px;
  transition: all var(--transition);
}

.section-badge.has-data {
  color: var(--accent);
  background: rgba(233,69,96,0.15);
  font-weight: 600;
}

.section-body {
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  max-height: 200px;
  overflow-y: auto;
}

.section.collapsed .section-body {
  display: none;
}

.section.collapsed {
  border-color: transparent;
  background: transparent;
}

.section.collapsed .section-header {
  background: rgba(255,255,255,0.02);
  border-radius: var(--radius);
}

.section.collapsed:hover {
  border-color: var(--border);
}

/* ========== PRESET BUTTONS ========== */
.presets-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.preset-btn {
  padding: 5px 12px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 500;
  cursor: pointer;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-dim);
  transition: all var(--transition);
}

.preset-btn:hover {
  border-color: var(--orange);
  color: var(--orange);
  background: rgba(255,183,77,0.1);
}

.preset-btn.active {
  border-color: var(--orange);
  color: var(--orange);
  background: rgba(255,183,77,0.15);
  font-weight: 600;
}

/* ========== COMMIT INFO ========== */
.commit-info {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.commit-hash {
  font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', monospace;
  font-size: 12px;
  color: var(--yellow);
}

.commit-msg {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-bright);
  line-height: 1.4;
}

.commit-meta {
  font-size: 11px;
  color: var(--text-dim);
  display: flex;
  gap: 12px;
}

.commit-meta span {
  display: flex;
  align-items: center;
  gap: 4px;
}

/* ========== FILE LIST ========== */
.file-list {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.file-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 10px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all var(--transition);
  font-size: 12px;
}

.file-item:hover {
  background: rgba(255,255,255,0.05);
}

.file-item .file-icon {
  font-size: 14px;
  flex-shrink: 0;
}

.file-item .file-name {
  font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', monospace;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.file-item .file-stats {
  margin-left: auto;
  font-size: 11px;
  white-space: nowrap;
  flex-shrink: 0;
}

.file-item .file-stats .add-count {
  color: var(--green);
}

.file-item .file-stats .del-count {
  color: var(--accent);
  margin-left: 4px;
}

/* ========== REVIEW SUMMARY ========== */
.summary-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.summary-card {
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 10px;
  text-align: center;
}

.summary-card .num {
  font-size: 20px;
  font-weight: 700;
  color: var(--text-bright);
}

.summary-card .label {
  font-size: 11px;
  color: var(--text-dim);
  margin-top: 2px;
}

/* ========== DIFF CONTENT ========== */
.diff-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}

.diff-header h2 {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-bright);
}

.diff-file-card {
  background: var(--input-bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: 16px;
  overflow: hidden;
}

.diff-file-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 14px;
  background: rgba(255,255,255,0.03);
  cursor: pointer;
  user-select: none;
  border-bottom: 1px solid var(--border);
  transition: background var(--transition);
}

.diff-file-header:hover {
  background: rgba(255,255,255,0.05);
}

.diff-file-header .file-path {
  font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', monospace;
  font-size: 13px;
  color: var(--blue);
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 8px;
}

.diff-file-header .file-path .chevron {
  font-size: 10px;
  color: var(--text-dim);
  transition: transform var(--transition);
  display: inline-block;
}

.diff-file-card:not(.collapsed) .diff-file-header .chevron {
  transform: rotate(90deg);
}

.diff-file-header .file-stat-pills {
  display: flex;
  gap: 6px;
  font-size: 11px;
  font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', monospace;
}

.stat-pill-add {
  color: var(--green);
  background: rgba(102,187,106,0.12);
  padding: 2px 8px;
  border-radius: 10px;
}

.stat-pill-del {
  color: var(--accent);
  background: rgba(233,69,96,0.12);
  padding: 2px 8px;
  border-radius: 10px;
}

.diff-file-body {
  overflow: hidden;
}

.diff-file-card.collapsed .diff-file-body {
  display: none;
}

/* ========== DIFF LINES ========== */
.diff-table {
  width: 100%;
  border-collapse: collapse;
  font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
  font-size: 12px;
  line-height: 1.6;
}

.diff-line {
  cursor: pointer;
  transition: background 0.1s ease;
}

.diff-line:hover {
  filter: brightness(1.3);
}

.diff-line td {
  padding: 1px 0;
  vertical-align: top;
  white-space: pre;
}

.diff-line .line-num {
  width: 44px;
  min-width: 44px;
  text-align: right;
  padding-right: 8px;
  color: var(--text-dim);
  user-select: none;
  font-size: 11px;
  opacity: 0.6;
}

.diff-line .line-num-old {
  border-right: 1px solid rgba(255,255,255,0.04);
}

.diff-line .line-prefix {
  width: 18px;
  min-width: 18px;
  text-align: center;
  user-select: none;
  font-weight: 600;
}

.diff-line .line-content {
  padding-left: 8px;
  padding-right: 12px;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* Line type styles */
.diff-line.line-context {
  background: transparent;
}

.diff-line.line-add {
  background: var(--diff-add-bg);
}
.diff-line.line-add .line-prefix {
  color: var(--green);
}
.diff-line.line-add .line-content {
  color: var(--green);
}

.diff-line.line-del {
  background: var(--diff-del-bg);
}
.diff-line.line-del .line-prefix {
  color: var(--accent);
}
.diff-line.line-del .line-content {
  color: var(--accent);
}

.diff-line.line-hunk {
  background: var(--diff-hunk-bg);
  cursor: default;
}
.diff-line.line-hunk:hover {
  filter: none;
}
.diff-line.line-hunk td {
  padding: 4px 0;
}
.diff-line.line-hunk .line-content {
  color: var(--blue);
  font-style: italic;
  font-weight: 500;
}

/* Comment badge */
.comment-badge {
  display: inline-block;
  margin-left: 8px;
  font-size: 12px;
  vertical-align: middle;
  cursor: pointer;
  opacity: 0.8;
}

/* ========== INLINE COMMENT ========== */
.inline-comment-row td {
  padding: 0 !important;
}

.inline-comment-box {
  background: rgba(79,195,247,0.05);
  border-top: 2px solid var(--blue);
  border-bottom: 2px solid var(--blue);
  padding: 12px 16px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.inline-comment-box textarea {
  background: var(--input-bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text);
  padding: 8px 10px;
  font-size: 12px;
  font-family: inherit;
  outline: none;
  resize: vertical;
  min-height: 60px;
  transition: border-color var(--transition);
  width: 100%;
}

.inline-comment-box textarea:focus {
  border-color: var(--blue);
}

.inline-comment-box .comment-actions {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
}

.btn {
  padding: 6px 14px;
  border-radius: var(--radius-sm);
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  border: 1px solid var(--border);
  background: var(--chip-bg);
  color: var(--text);
  transition: all var(--transition);
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

.btn:hover {
  background: var(--panel-hover);
  border-color: var(--blue);
  color: var(--blue);
}

.btn-primary {
  background: var(--blue);
  border-color: var(--blue);
  color: #0f1629;
  font-weight: 600;
}

.btn-primary:hover {
  background: #7ad4fa;
  border-color: #7ad4fa;
  color: #0f1629;
}

.btn-cancel {
  color: var(--text-dim);
}

.btn-cancel:hover {
  color: var(--accent);
  border-color: var(--accent);
}

/* Saved comment display */
.saved-comment-row td {
  padding: 0 !important;
}

.saved-comment-display {
  background: rgba(79,195,247,0.04);
  border-left: 3px solid var(--blue);
  padding: 8px 16px;
  font-size: 12px;
  color: var(--text);
  line-height: 1.5;
  cursor: pointer;
  transition: background var(--transition);
}

.saved-comment-display:hover {
  background: rgba(79,195,247,0.08);
}

.saved-comment-display .comment-author {
  font-weight: 600;
  color: var(--blue);
  margin-bottom: 2px;
  font-size: 11px;
}

/* ========== PROMPT OUTPUT ========== */
.prompt-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}

.prompt-header h2 {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-bright);
}

.prompt-text {
  font-size: 13px;
  line-height: 1.7;
  padding: 16px;
  background: var(--input-bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  min-height: 60px;
  color: var(--text);
  white-space: pre-wrap;
  word-break: break-word;
}

.prompt-text .review-file {
  color: var(--blue);
  font-weight: 600;
}

.prompt-text .review-line {
  color: var(--yellow);
  font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', monospace;
  font-size: 12px;
}

.prompt-text .review-code {
  color: var(--text-dim);
  font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', monospace;
  font-size: 12px;
}

.prompt-text .review-comment {
  color: var(--text-bright);
}

.copy-btn {
  padding: 6px 16px;
  border-radius: var(--radius-sm);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  border: 1px solid var(--accent);
  background: transparent;
  color: var(--accent);
  transition: all var(--transition);
}

.copy-btn:hover {
  background: var(--accent);
  color: white;
}

.copy-btn.copied {
  background: var(--green);
  border-color: var(--green);
  color: white;
}

/* ========== RESET BUTTON ========== */
.reset-btn {
  padding: 4px 10px;
  border-radius: var(--radius-sm);
  font-size: 11px;
  cursor: pointer;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-dim);
  transition: all var(--transition);
}

.reset-btn:hover {
  border-color: var(--accent);
  color: var(--accent);
}

/* ========== EMPTY HINT ========== */
.empty-hint {
  font-size: 12px;
  color: var(--text-dim);
  font-style: italic;
  padding: 8px 0;
}

/* ========== SCROLLBAR ========== */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: #4a5a7c; }
</style>
</head>
<body>
<div class="app">
  <!-- LEFT PANEL -->
  <div class="left-panel" id="leftPanel">
    <div class="app-header">
      <div>
        <h1>Diff Review</h1>
        <div class="subtitle">Interactive Code Review Playground</div>
      </div>
      <button class="reset-btn" onclick="resetAll()">초기화</button>
    </div>

    <!-- Presets -->
    <div class="section" id="presetSection">
      <div class="section-header" onclick="toggleSection(this)">
        <span class="section-title">프리셋 <span class="keyword">PRESETS</span></span>
      </div>
      <div class="section-body">
        <div class="presets-bar" id="presetsBar"></div>
      </div>
    </div>

    <!-- Commit Info -->
    <div class="section" id="commitSection">
      <div class="section-header" onclick="toggleSection(this)">
        <span class="section-title">커밋 정보 <span class="keyword">COMMIT</span></span>
      </div>
      <div class="section-body" style="max-height:none;">
        <div class="commit-info" id="commitInfo">
          <div class="empty-hint">프리셋을 선택하세요</div>
        </div>
      </div>
    </div>

    <!-- File List -->
    <div class="section" id="fileSection">
      <div class="section-header" onclick="toggleSection(this)">
        <span class="section-title">변경 파일 <span class="keyword">FILES</span></span>
        <span class="section-badge" id="fileCount">0개</span>
      </div>
      <div class="section-body">
        <div class="file-list" id="fileList">
          <div class="empty-hint">프리셋을 선택하세요</div>
        </div>
      </div>
    </div>

    <!-- Review Summary -->
    <div class="section" id="summarySection">
      <div class="section-header" onclick="toggleSection(this)">
        <span class="section-title">리뷰 요약 <span class="keyword">SUMMARY</span></span>
        <span class="section-badge" id="reviewBadge">0건</span>
      </div>
      <div class="section-body" style="max-height:none;">
        <div class="summary-grid" id="summaryGrid">
          <div class="summary-card">
            <div class="num" id="totalComments">0</div>
            <div class="label">코멘트</div>
          </div>
          <div class="summary-card">
            <div class="num" id="filesReviewed">0</div>
            <div class="label">리뷰 파일</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- RIGHT PANEL -->
  <div class="right-panel">
    <div class="diff-panel" id="diffPanel">
      <div class="diff-header">
        <h2>Diff 미리보기</h2>
      </div>
      <div id="diffContent">
        <div class="empty-hint" style="text-align:center;padding:40px;">프리셋을 선택하여 Diff를 로드하세요</div>
      </div>
    </div>
    <div class="prompt-output">
      <div class="prompt-header">
        <h2>코드 리뷰 출력</h2>
        <button class="copy-btn" id="promptCopyBtn" onclick="copyPrompt()">리뷰 복사</button>
      </div>
      <div class="prompt-text" id="promptOutput">코드 리뷰 없음 - 라인을 클릭하여 리뷰를 시작하세요</div>
    </div>
  </div>
</div>

              { type: 'add', old: null, new: 8, text: '    timer = setTimeout(() => fn(...args), ms);' },
              { type: 'context', old: 6, new: 9, text: '  };' },
              { type: 'context', old: 7, new: 10, text: '}' }
            ]
          }
        ]
      }
    ]
  }
];

// ============================================
// STATE
// ============================================

var state = {
  activePreset: -1,
  comments: {},      // key: "fileIdx-lineIdx" => { text, fileIdx, lineIdx }
  openCommentKey: null // currently open inline comment editor
};

// ============================================
// CORE FUNCTIONS
// ============================================

function resetAll() {
  state = {
    activePreset: -1,
    comments: {},
    openCommentKey: null
  };
  renderAll();
}

function toggleSection(header) {
  header.parentElement.classList.toggle('collapsed');
}

function selectPreset(idx) {
  state.activePreset = idx;
  state.comments = {};
  state.openCommentKey = null;
  renderAll();
}

function escapeHtml(str) {
  if (!str) return '';
  return str
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#x27;');
}

// ============================================
// RENDER
// ============================================

function renderAll() {
  renderPresets();
  renderCommitInfo();
  renderFileList();
  renderDiff();
  renderSummary();
  renderPrompt();
}

function renderPresets() {
  var el = document.getElementById('presetsBar');
  el.innerHTML = PRESETS.map(function(p, i) {
    var cls = state.activePreset === i ? 'preset-btn active' : 'preset-btn';
    return '<button class="' + cls + '" onclick="selectPreset(' + i + ')">' + escapeHtml(p.name) + '</button>';
  }).join('');
}

function renderCommitInfo() {
  var el = document.getElementById('commitInfo');
  if (state.activePreset < 0) {
    el.innerHTML = '<div class="empty-hint">프리셋을 선택하세요</div>';
    return;
  }
  var c = PRESETS[state.activePreset].commit;
  el.innerHTML =
    '<div class="commit-hash">' + escapeHtml(c.hash) + '</div>' +
    '<div class="commit-msg">' + escapeHtml(c.message) + '</div>' +
    '<div class="commit-meta">' +
      '<span>&#128100; ' + escapeHtml(c.author) + '</span>' +
      '<span>&#128197; ' + escapeHtml(c.date) + '</span>' +
    '</div>';
}

function renderFileList() {
  var el = document.getElementById('fileList');
  var badge = document.getElementById('fileCount');
  if (state.activePreset < 0) {
    el.innerHTML = '<div class="empty-hint">프리셋을 선택하세요</div>';
    badge.textContent = '0개';
    badge.classList.remove('has-data');
    return;
  }
  var files = PRESETS[state.activePreset].files;
  badge.textContent = files.length + '개';
  badge.classList.add('has-data');

  el.innerHTML = files.map(function(f, fi) {
    var adds = 0, dels = 0;
    f.hunks.forEach(function(h) {
      h.lines.forEach(function(l) {
        if (l.type === 'add') adds++;
        if (l.type === 'del') dels++;
      });
    });
    var ext = f.path.split('.').pop();
    var icon = ext === 'ts' || ext === 'tsx' ? '&#128309;' : ext === 'js' || ext === 'jsx' ? '&#128993;' : '&#128196;';
    return '<div class="file-item" onclick="scrollToFile(' + fi + ')">' +
      '<span class="file-icon">' + icon + '</span>' +
      '<span class="file-name">' + escapeHtml(f.path) + '</span>' +
      '<span class="file-stats"><span class="add-count">+' + adds + '</span><span class="del-count">-' + dels + '</span></span>' +
    '</div>';
  }).join('');
}

function renderDiff() {
  var el = document.getElementById('diffContent');
  if (state.activePreset < 0) {
    el.innerHTML = '<div class="empty-hint" style="text-align:center;padding:40px;">프리셋을 선택하여 Diff를 로드하세요</div>';
    return;
  }
  var files = PRESETS[state.activePreset].files;
  var html = '';
  files.forEach(function(file, fi) {
    var adds = 0, dels = 0;
    file.hunks.forEach(function(h) {
      h.lines.forEach(function(l) {
        if (l.type === 'add') adds++;
        if (l.type === 'del') dels++;
      });
    });

    html += '<div class="diff-file-card" id="file-card-' + fi + '">';
    html += '<div class="diff-file-header" onclick="toggleFileCard(' + fi + ')">';
    html += '<span class="file-path"><span class="chevron">&#9654;</span> ' + escapeHtml(file.path) + '</span>';
    html += '<span class="file-stat-pills">';
    if (adds > 0) html += '<span class="stat-pill-add">+' + adds + '</span>';
    if (dels > 0) html += '<span class="stat-pill-del">-' + dels + '</span>';
    html += '</span>';
    html += '</div>';
    html += '<div class="diff-file-body">';
    html += '<table class="diff-table">';

    file.hunks.forEach(function(hunk) {
      // Hunk header line
      html += '<tr class="diff-line line-hunk">';
      html += '<td class="line-num line-num-old"></td>';
      html += '<td class="line-num"></td>';
      html += '<td class="line-prefix"></td>';
      html += '<td class="line-content">' + escapeHtml(hunk.header) + '</td>';
      html += '</tr>';

      hunk.lines.forEach(function(line, li) {
        var key = fi + '-' + hunk.header + '-' + li;
        var lineClass = 'diff-line';
        var prefix = ' ';
        if (line.type === 'add') { lineClass += ' line-add'; prefix = '+'; }
        else if (line.type === 'del') { lineClass += ' line-del'; prefix = '-'; }
        else { lineClass += ' line-context'; }

        var hasComment = state.comments[key] && state.comments[key].text;
        var commentBadge = hasComment ? '<span class="comment-badge">&#128172;</span>' : '';

        html += '<tr class="' + lineClass + '" onclick="toggleComment(\'' + escapeHtml(key) + '\',' + fi + ')" data-key="' + escapeHtml(key) + '">';
        html += '<td class="line-num line-num-old">' + (line.old !== null ? line.old : '') + '</td>';
        html += '<td class="line-num">' + (line.new !== null ? line.new : '') + '</td>';
        html += '<td class="line-prefix">' + prefix + '</td>';
        html += '<td class="line-content">' + escapeHtml(line.text) + commentBadge + '</td>';
        html += '</tr>';

        // Saved comment display
        if (hasComment && state.openCommentKey !== key) {
          html += '<tr class="saved-comment-row">';
          html += '<td colspan="4"><div class="saved-comment-display" onclick="toggleComment(\'' + escapeHtml(key) + '\',' + fi + ')">';
          html += '<div class="comment-author">&#9998; 리뷰 코멘트</div>';
          html += '<div>' + escapeHtml(state.comments[key].text) + '</div>';
          html += '</div></td>';
          html += '</tr>';
        }

        // Inline comment editor
        if (state.openCommentKey === key) {
          var existingText = (state.comments[key] && state.comments[key].text) || '';
          html += '<tr class="inline-comment-row">';
          html += '<td colspan="4"><div class="inline-comment-box">';
          html += '<textarea id="comment-textarea" placeholder="코드 리뷰 코멘트를 입력하세요...">' + escapeHtml(existingText) + '</textarea>';
          html += '<div class="comment-actions">';
          html += '<button class="btn btn-cancel" onclick="cancelComment(event)">취소</button>';
          html += '<button class="btn btn-primary" onclick="saveComment(event, \'' + escapeHtml(key) + '\',' + fi + ')">저장</button>';
          html += '</div>';
          html += '</div></td>';
          html += '</tr>';
        }
      });
    });

    html += '</table>';
    html += '</div>'; // diff-file-body
    html += '</div>'; // diff-file-card
  });

  el.innerHTML = html;

  // Focus textarea if open
  if (state.openCommentKey !== null) {
    var ta = document.getElementById('comment-textarea');
    if (ta) {
      ta.focus();
      // Move cursor to end
      ta.selectionStart = ta.selectionEnd = ta.value.length;
    }
  }
}

function renderSummary() {
  var totalComments = 0;
  var fileSet = {};
  Object.keys(state.comments).forEach(function(key) {
    if (state.comments[key] && state.comments[key].text) {
      totalComments++;
      fileSet[state.comments[key].fileIdx] = true;
    }
  });
  var filesReviewed = Object.keys(fileSet).length;

  document.getElementById('totalComments').textContent = totalComments;
  document.getElementById('filesReviewed').textContent = filesReviewed;

  var badge = document.getElementById('reviewBadge');
  badge.textContent = totalComments + '건';
  if (totalComments > 0) {
    badge.classList.add('has-data');
  } else {
    badge.classList.remove('has-data');
  }
}

function renderPrompt() {
  var el = document.getElementById('promptOutput');
  var entries = [];
  if (state.activePreset < 0) {
    el.innerHTML = '코드 리뷰 없음 - 라인을 클릭하여 리뷰를 시작하세요';
    return;
  }

  var files = PRESETS[state.activePreset].files;

  Object.keys(state.comments).forEach(function(key) {
    var c = state.comments[key];
    if (!c || !c.text) return;
    // Parse key to find line info
    var parts = key.split('-');
    var fileIdx = parseInt(parts[0]);
    var hunkHeader = parts.slice(1, parts.length - 1).join('-');
    var lineIdx = parseInt(parts[parts.length - 1]);

    var file = files[fileIdx];
    if (!file) return;

    // Find the actual line
    var lineInfo = null;
    file.hunks.forEach(function(h) {
      if (h.header === hunkHeader && h.lines[lineIdx]) {
        lineInfo = h.lines[lineIdx];
      }
    });

    if (lineInfo) {
      var lineNum = lineInfo.new !== null ? lineInfo.new : lineInfo.old;
      entries.push({
        filePath: file.path,
        lineNum: lineNum,
        code: lineInfo.text,
        comment: c.text
      });
    }
  });

  if (entries.length === 0) {
    el.innerHTML = '코드 리뷰 없음 - 라인을 클릭하여 리뷰를 시작하세요';
    return;
  }

  // Sort by file path then line number
  entries.sort(function(a, b) {
    if (a.filePath !== b.filePath) return a.filePath.localeCompare(b.filePath);
    return a.lineNum - b.lineNum;
  });

  var html = '';
  var currentFile = '';
  entries.forEach(function(e) {
    if (e.filePath !== currentFile) {
      if (currentFile) html += '\n';
      html += '<span class="review-file">' + escapeHtml(e.filePath) + '</span>\n';
      currentFile = e.filePath;
    }
    html += '  <span class="review-line">L' + e.lineNum + '</span> <span class="review-code">' + escapeHtml(e.code.trim()) + '</span>\n';
    html += '  <span class="review-comment">&rarr; ' + escapeHtml(e.comment) + '</span>\n';
  });

  el.innerHTML = html;
}

// ============================================
// INTERACTION
// ============================================

function toggleFileCard(fi) {
  var card = document.getElementById('file-card-' + fi);
  if (card) card.classList.toggle('collapsed');
}

function scrollToFile(fi) {
  var card = document.getElementById('file-card-' + fi);
  if (!card) return;
  // Ensure it's not collapsed
  card.classList.remove('collapsed');
  card.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function toggleComment(key, fileIdx) {
  if (state.openCommentKey === key) {
    state.openCommentKey = null;
  } else {
    state.openCommentKey = key;
  }
  renderDiff();
}

function saveComment(event, key, fileIdx) {
  event.stopPropagation();
  var ta = document.getElementById('comment-textarea');
  var text = ta ? ta.value.trim() : '';

  if (text) {
    state.comments[key] = { text: text, fileIdx: fileIdx };
  } else {
    // Empty text = delete comment
    delete state.comments[key];
  }
  state.openCommentKey = null;
  renderDiff();
  renderSummary();
  renderPrompt();
}

function cancelComment(event) {
  event.stopPropagation();
  state.openCommentKey = null;
  renderDiff();
}

function copyPrompt() {
  var el = document.getElementById('promptOutput');
  var text = el.innerText || el.textContent;
  navigator.clipboard.writeText(text).then(function() {
    var btn = document.getElementById('promptCopyBtn');
    btn.textContent = '복사됨!';
    btn.classList.add('copied');
    setTimeout(function() {
      btn.textContent = '리뷰 복사';
      btn.classList.remove('copied');
    }, 1500);
  });
}

// ============================================
// INIT
// ============================================

renderAll();
</script>
</body>
</html>
