<!DOCTYPE html>

<div class="w-full max-w-[850px] bg-surface rounded-xl overflow-hidden shadow-[0px_12px_32px_rgba(27,28,25,0.08)] flex flex-col relative">

<section class="bg-surface-container-low rounded-xl p-8 relative overflow-hidden">

<div class="relative z-10 flex flex-col items-center">

</div>

</div>
<div class="text-center">

</div>
</div>
</div>

<div class="w-full h-4 bg-surface-container-highest rounded-full overflow-hidden flex">
<div class="h-full bg-primary rounded-full transition-all duration-1000" style="width: 91.4%;"></div>
</div>
</div>
</section>

<div class="grid grid-cols-2 gap-8">

</div>
</div>

<div class="w-full border-t border-outline-variant/10"></div>
<div class="w-full border-t border-outline-variant/10"></div>
<div class="w-full border-t border-outline-variant/10"></div>
<div class="w-full border-t border-outline-variant/10"></div>

<!-- Jan -->
