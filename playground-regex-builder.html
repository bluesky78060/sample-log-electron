<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Regex Builder Playground</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #1a1a2e;
  --panel: #16213e;
  --panel-alt: #0f3460;
  --border: #2a2a5a;
  --text: #e0e0e0;
  --text-dim: #8888aa;
  --accent: #e94560;
  --accent-hover: #ff6b81;
  --success: #4ecca3;
  --warn: #f5a623;
  --mono: 'SF Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
  --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  --match-0: #ffd93d;
  --match-1: #6bc5f8;
  --match-2: #f06bdb;
  --match-3: #6bf0a0;
  --match-4: #f0a86b;
  --match-5: #a86bf0;
}

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.5;
  overflow: hidden;
}

.app {
  display: flex;
  height: 100vh;
  gap: 1px;
  background: var(--border);
}
.left-panel {
  width: 420px;
  min-width: 360px;
  background: var(--panel);
  overflow-y: auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 18px;
}
.right-panel {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 1px;
  background: var(--border);
  min-width: 0;
}
.right-top {
  flex: 1;
  background: var(--panel);
  overflow-y: auto;
  padding: 20px;
  min-height: 0;
}
.right-bottom {
  height: 260px;
  min-height: 180px;
  background: var(--panel);
  overflow-y: auto;
  padding: 20px;
  border-top: 1px solid var(--border);
}

::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: #4a4a7a; }

.section { display: flex; flex-direction: column; gap: 8px; }
.section-title {
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--accent);
  display: flex;
  align-items: center;
  gap: 6px;
}
.section-title::before {
  content: '';
  width: 3px;
  height: 14px;
  background: var(--accent);
  border-radius: 2px;
}

.regex-input-wrap {
  display: flex;
  align-items: stretch;
  background: var(--bg);
  border: 2px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
  transition: border-color 0.2s;
}
.regex-input-wrap:focus-within { border-color: var(--accent); }
.regex-slash {
  display: flex;
  align-items: center;
  padding: 0 10px;
  color: var(--accent);
  font-family: var(--mono);
  font-size: 20px;
  font-weight: bold;
  user-select: none;
}
#regexInput {
  flex: 1;
  background: transparent;
  border: none;
  color: var(--text);
  font-family: var(--mono);
  font-size: 16px;
  padding: 12px 4px;
  outline: none;
  min-width: 0;
}
#regexInput::placeholder { color: var(--text-dim); }
.regex-error {
  background: #3d1a2e;
  color: #ff6b81;
  font-family: var(--mono);
  font-size: 12px;
  padding: 6px 12px;
  border-radius: 6px;
  display: none;
  border: 1px solid #5a2040;
}
.regex-error.visible { display: block; }

.flags-row {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.flag-btn {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 5px 12px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text-dim);
  font-family: var(--mono);
  font-size: 13px;
  cursor: pointer;
  transition: all 0.15s;
  user-select: none;
}
.flag-btn:hover { border-color: var(--accent); color: var(--text); }
.flag-btn.active {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}
.flag-btn .flag-label {
  font-family: var(--sans);
  font-size: 11px;
  opacity: 0.7;
}

.blocks-category { margin-bottom: 6px; }
.blocks-category-title {
  font-size: 11px;
  color: var(--text-dim);
  margin-bottom: 4px;
  font-weight: 500;
}
.blocks-row {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}
.block-btn {
  padding: 4px 10px;
  border-radius: 5px;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text);
  font-family: var(--mono);
  font-size: 12px;
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
}
.block-btn:hover {
  border-color: var(--accent);
  background: #2a1a3e;
  transform: translateY(-1px);
}
.block-btn:active { transform: translateY(0); }
.block-btn .block-label {
  font-family: var(--sans);
  font-size: 10px;
  color: var(--text-dim);
  margin-left: 4px;
}

textarea {
  width: 100%;
  background: var(--bg);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 12px;
  font-family: var(--mono);
  font-size: 13px;
  line-height: 1.6;
  resize: vertical;
  outline: none;
  transition: border-color 0.2s;
}
textarea:focus { border-color: var(--accent); }

.presets-row {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.preset-btn {
  padding: 6px 14px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: var(--panel-alt);
  color: var(--text);
  font-size: 12px;
  cursor: pointer;
  transition: all 0.15s;
}
.preset-btn:hover {
  border-color: var(--accent);
  background: var(--accent);
  color: #fff;
}

.preview-area {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px 16px;
  font-family: var(--mono);
  font-size: 13px;
  line-height: 1.8;
  white-space: pre-wrap;
  word-break: break-all;
  min-height: 100px;
}
.match-hl-0 { background: rgba(255,217,61,0.35); color: #ffd93d; border-radius: 2px; outline: 1px solid rgba(255,217,61,0.5); }
.match-hl-1 { background: rgba(107,197,248,0.3); color: #6bc5f8; border-radius: 2px; }
.match-hl-2 { background: rgba(240,107,219,0.3); color: #f06bdb; border-radius: 2px; }
.match-hl-3 { background: rgba(107,240,160,0.3); color: #6bf0a0; border-radius: 2px; }
.match-hl-4 { background: rgba(240,168,107,0.3); color: #f0a86b; border-radius: 2px; }
.match-hl-5 { background: rgba(168,107,240,0.3); color: #a86bf0; border-radius: 2px; }

.match-counter {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  color: var(--text-dim);
  margin-bottom: 10px;
}
.match-counter .count {
  background: var(--accent);
  color: #fff;
  padding: 2px 10px;
  border-radius: 12px;
  font-weight: 600;
  font-size: 12px;
}
.match-counter .count.zero {
  background: var(--border);
  color: var(--text-dim);
}

.matches-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-top: 10px;
  max-height: 300px;
  overflow-y: auto;
}
.match-item {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 8px 12px;
  font-family: var(--mono);
  font-size: 12px;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: baseline;
}
.match-item .mi-index {
  color: var(--text-dim);
  font-size: 10px;
  min-width: 28px;
}
.match-item .mi-text {
  color: var(--match-0);
  font-weight: 600;
  word-break: break-all;
}
.match-item .mi-pos {
  color: var(--text-dim);
  font-size: 10px;
  margin-left: auto;
}
.match-groups {
  width: 100%;
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  padding-top: 4px;
  border-top: 1px solid var(--border);
  margin-top: 4px;
}
.match-group-tag {
  font-size: 10px;
  padding: 1px 8px;
  border-radius: 4px;
  border: 1px solid;
}
.mg-1 { border-color: rgba(107,197,248,0.5); color: #6bc5f8; background: rgba(107,197,248,0.1); }
.mg-2 { border-color: rgba(240,107,219,0.5); color: #f06bdb; background: rgba(240,107,219,0.1); }
.mg-3 { border-color: rgba(107,240,160,0.5); color: #6bf0a0; background: rgba(107,240,160,0.1); }
.mg-4 { border-color: rgba(240,168,107,0.5); color: #f0a86b; background: rgba(240,168,107,0.1); }
.mg-5 { border-color: rgba(168,107,240,0.5); color: #a86bf0; background: rgba(168,107,240,0.1); }

.explanation-box {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px 14px;
  font-size: 13px;
  line-height: 1.6;
  color: var(--text);
}
.explanation-box .exp-token {
  font-family: var(--mono);
  color: var(--accent);
  font-weight: 600;
}

.prompt-output-area { position: relative; }
.prompt-box {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px 16px;
  padding-right: 80px;
  font-size: 13px;
  line-height: 1.6;
  color: var(--text);
  min-height: 60px;
  white-space: pre-wrap;
}
.copy-btn {
  position: absolute;
  top: 8px;
  right: 8px;
  padding: 5px 14px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--panel-alt);
  color: var(--text);
  font-size: 12px;
  cursor: pointer;
  transition: all 0.15s;
}
.copy-btn:hover { background: var(--accent); border-color: var(--accent); color: #fff; }
.copy-btn.copied { background: var(--success); border-color: var(--success); color: #fff; }

.rpanel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}
.rpanel-header h2 {
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
}

.color-legend {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  font-size: 11px;
  color: var(--text-dim);
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 4px;
}
.legend-swatch {
  width: 12px;
  height: 12px;
  border-radius: 3px;
}

.clear-btn {
  padding: 3px 10px;
  border-radius: 5px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-dim);
  font-size: 11px;
  cursor: pointer;
  transition: all 0.15s;
}
.clear-btn:hover { border-color: var(--accent); color: var(--accent); }

@media (max-width: 900px) {
  .app { flex-direction: column; }
  .left-panel { width: 100%; max-height: 50vh; }
  .right-bottom { height: 200px; }
}
</style>
</head>
<body>
<div class="app">
  <!-- LEFT PANEL -->
  <div class="left-panel">
    <div style="display:flex;align-items:center;gap:10px;padding-bottom:6px;border-bottom:1px solid var(--border);">
      <div style="font-size:22px;font-weight:700;color:var(--accent);">/regex/</div>
      <div style="font-size:13px;color:var(--text-dim);">Regex Builder</div>
    </div>

    <!-- Regex Input -->
    <div class="section">
      <div class="section-title">정규식 패턴</div>
      <div class="regex-input-wrap">
        <span class="regex-slash">/</span>
        <input type="text" id="regexInput" placeholder="패턴을 입력하세요..." spellcheck="false" autocomplete="off">
        <span class="regex-slash">/</span>
      </div>
      <div id="regexError" class="regex-error"></div>
    </div>

    <!-- Flags -->
    <div class="section">
      <div class="section-title">플래그</div>
      <div class="flags-row">
        <button class="flag-btn active" data-flag="g">g <span class="flag-label">전역</span></button>
        <button class="flag-btn" data-flag="i">i <span class="flag-label">대소문자</span></button>
        <button class="flag-btn" data-flag="m">m <span class="flag-label">멀티라인</span></button>
        <button class="flag-btn" data-flag="s">s <span class="flag-label">dotAll</span></button>
        <button class="flag-btn" data-flag="u">u <span class="flag-label">유니코드</span></button>
      </div>
    </div>

    <!-- Visual Builder -->
    <div class="section">
      <div class="section-title">패턴 빌더</div>
      <div class="blocks-category">
        <div class="blocks-category-title">문자</div>
        <div class="blocks-row">
          <button class="block-btn" data-insert=".">.<span class="block-label">모든 문자</span></button>
          <button class="block-btn" data-insert="\d">\d<span class="block-label">숫자</span></button>
          <button class="block-btn" data-insert="\D">\D<span class="block-label">비숫자</span></button>
          <button class="block-btn" data-insert="\w">\w<span class="block-label">단어</span></button>
          <button class="block-btn" data-insert="\W">\W<span class="block-label">비단어</span></button>
          <button class="block-btn" data-insert="\s">\s<span class="block-label">공백</span></button>
          <button class="block-btn" data-insert="\S">\S<span class="block-label">비공백</span></button>
          <button class="block-btn" data-insert="\b">\b<span class="block-label">경계</span></button>
        </div>
      </div>
      <div class="blocks-category">
        <div class="blocks-category-title">수량자</div>
        <div class="blocks-row">
          <button class="block-btn" data-insert="*">*<span class="block-label">0회+</span></button>
          <button class="block-btn" data-insert="+">+<span class="block-label">1회+</span></button>
          <button class="block-btn" data-insert="?">?<span class="block-label">0 or 1</span></button>
          <button class="block-btn" data-insert="{n}">{n}<span class="block-label">정확히 n</span></button>
          <button class="block-btn" data-insert="{n,m}">{n,m}<span class="block-label">n~m회</span></button>
          <button class="block-btn" data-insert="*?">*?<span class="block-label">게으른 0+</span></button>
          <button class="block-btn" data-insert="+?">+?<span class="block-label">게으른 1+</span></button>
        </div>
      </div>
      <div class="blocks-category">
        <div class="blocks-category-title">그룹</div>
        <div class="blocks-row">
          <button class="block-btn" data-insert="()" data-cursor="-1">()</button>
          <button class="block-btn" data-insert="(?:)" data-cursor="-1">(?:)<span class="block-label">비캡처</span></button>
          <button class="block-btn" data-insert="(?=)" data-cursor="-1">(?=)<span class="block-label">전방탐색</span></button>
          <button class="block-btn" data-insert="(?!)" data-cursor="-1">(?!)<span class="block-label">부정전방</span></button>
          <button class="block-btn" data-insert="(?&lt;=)" data-cursor="-1">(?&lt;=)<span class="block-label">후방탐색</span></button>
          <button class="block-btn" data-insert="(?&lt;!)" data-cursor="-1">(?&lt;!)<span class="block-label">부정후방</span></button>
        </div>
      </div>
      <div class="blocks-category">
        <div class="blocks-category-title">앵커</div>
        <div class="blocks-row">
          <button class="block-btn" data-insert="^">^<span class="block-label">시작</span></button>
          <button class="block-btn" data-insert="$">$<span class="block-label">끝</span></button>
        </div>
      </div>
      <div class="blocks-category">
        <div class="blocks-category-title">문자 클래스</div>
        <div class="blocks-row">
          <button class="block-btn" data-insert="[]" data-cursor="-1">[abc]</button>
          <button class="block-btn" data-insert="[a-z]">[a-z]</button>
          <button class="block-btn" data-insert="[A-Z]">[A-Z]</button>
          <button class="block-btn" data-insert="[0-9]">[0-9]</button>
          <button class="block-btn" data-insert="[^]" data-cursor="-1">[^abc]<span class="block-label">부정</span></button>
        </div>
      </div>
      <div class="blocks-category">
        <div class="blocks-category-title">기타</div>
        <div class="blocks-row">
          <button class="block-btn" data-insert="|">|<span class="block-label">또는</span></button>
          <button class="block-btn" data-insert="\.">\.<span class="block-label">리터럴 .</span></button>
          <button class="block-btn" data-insert="\(">\(<span class="block-label">리터럴 (</span></button>
          <button class="block-btn" data-insert="\)">\)<span class="block-label">리터럴 )</span></button>
          <button class="block-btn" data-insert="\\">\\\<span class="block-label">리터럴 \</span></button>
          <button class="block-btn" data-insert="\/">\/<span class="block-label">리터럴 /</span></button>
        </div>
      </div>
    </div>

    <!-- Presets -->
    <div class="section">
      <div class="section-title">프리셋</div>
      <div class="presets-row">
        <button class="preset-btn" data-preset="email">이메일 주소</button>
        <button class="preset-btn" data-preset="phone">전화번호</button>
        <button class="preset-btn" data-preset="url">URL 파싱</button>
        <button class="preset-btn" data-preset="date">날짜 형식</button>
        <button class="preset-btn" data-preset="html">HTML 태그</button>
      </div>
    </div>

    <!-- Test Strings -->
    <div class="section">
      <div class="section-title" style="justify-content:space-between;width:100%;">
        <span style="display:flex;align-items:center;gap:6px;"><span style="width:3px;height:14px;background:var(--accent);border-radius:2px;display:inline-block;"></span>테스트 문자열</span>
        <button class="clear-btn" id="clearSample">초기화</button>
      </div>
      <textarea id="sampleText" rows="10" spellcheck="false" placeholder="매칭할 텍스트를 입력하세요..."></textarea>
    </div>

    <!-- Explanation -->
    <div class="section">
      <div class="section-title">패턴 설명</div>
      <div id="explanation" class="explanation-box" style="color:var(--text-dim);font-style:italic;">패턴을 입력하면 설명이 표시됩니다.</div>
    </div>
  </div>

  <!-- RIGHT PANEL -->
  <div class="right-panel">
    <div class="right-top">
      <div class="rpanel-header">
        <h2>매칭 미리보기</h2>
        <div class="color-legend">
          <div class="legend-item"><div class="legend-swatch" style="background:rgba(255,217,61,0.4);"></div>전체 매치</div>
          <div class="legend-item"><div class="legend-swatch" style="background:rgba(107,197,248,0.4);"></div>그룹 1</div>
          <div class="legend-item"><div class="legend-swatch" style="background:rgba(240,107,219,0.4);"></div>그룹 2</div>
          <div class="legend-item"><div class="legend-swatch" style="background:rgba(107,240,160,0.4);"></div>그룹 3</div>
        </div>
      </div>
      <div class="match-counter">
        매치: <span id="matchCount" class="count zero">0</span>
      </div>
      <div id="preview" class="preview-area" style="color:var(--text-dim);font-style:italic;">정규식과 테스트 문자열을 입력하세요.</div>
      <div id="matchResults" class="matches-list"></div>
    </div>

    <div class="right-bottom">
      <div class="rpanel-header">
        <h2>프롬프트 출력</h2>
      </div>
      <div class="prompt-output-area">
        <div id="promptOutput" class="prompt-box" style="color:var(--text-dim);font-style:italic;">정규식이 완성되면 자연어 프롬프트가 생성됩니다.</div>
        <button id="copyBtn" class="copy-btn">복사</button>
      </div>
    </div>
  </div>
</div>

<script>
(function() {
  'use strict';

  // ============================================================
  // STATE
  // ============================================================
  var state = {
    pattern: '',
    flags: { g: true, i: false, m: false, s: false, u: false },
    sampleText: '',
    error: null,
    matches: [],
    regex: null,
  };

  var PRESETS = {
    email: {
      pattern: '([\\w.-]+)@([\\w.-]+\\.\\w{2,})',
      flags: { g: true, i: true, m: false, s: false, u: false },
      sample: "\uC720\uD6A8\uD55C \uC774\uBA54\uC77C:\nuser@example.com\njohn.doe@company.co.kr\ntest+tag@gmail.com\nadmin@sub.domain.org\n\n\uC798\uBABB\uB41C \uC774\uBA54\uC77C:\n@missing-user.com\nno-at-sign.com\nspaces@ domain.com\nuser@.invalid"
    },
    phone: {
      pattern: '(0\\d{1,2})[-.]?(\\d{3,4})[-.]?(\\d{4})',
      flags: { g: true, i: false, m: false, s: false, u: false },
      sample: "\uC804\uD654\uBC88\uD638 \uBAA9\uB85D:\n010-1234-5678\n02-123-4567\n031.234.5678\n01012345678\n055-1234-5678\n070-1234-5678\n\n\uC798\uBABB\uB41C \uBC88\uD638:\n123-4567\n1234-5678-9012\nabc-defg-hijk"
    },
    url: {
      pattern: '(https?://)([\\w.-]+)(/?[\\w./-]*)(\\?[\\w=&.-]*)?',
      flags: { g: true, i: true, m: false, s: false, u: false },
      sample: "URL \uC608\uC2DC:\nhttps://www.example.com/path/to/page?query=1&lang=ko\nhttp://api.service.com/v2/users\nhttps://docs.google.com/spreadsheets/d/abc123\nhttp://localhost:3000/dev\n\n\uC77C\uBC18 \uD14D\uC2A4\uD2B8:\n\uC774 \uBB38\uC11C\uB294 example.com\uC744 \uCC38\uC870\uD569\uB2C8\uB2E4.\nftp://not-matched.com"
    },
    date: {
      pattern: '(\\d{4})[-./ ](\\d{1,2})[-./ ](\\d{1,2})|(\\d{1,2})[/. ](\\d{1,2})[/. ](\\d{4})',
      flags: { g: true, i: false, m: false, s: false, u: false },
      sample: "\uB0A0\uC9DC \uD615\uC2DD:\n2026-02-22\n2026.02.22\n2026/02/22\n2026 02 22\n22/02/2026\n22.02.2026\n\n\uC798\uBABB\uB41C \uB0A0\uC9DC:\n2026-13-45\n02-22\n20260222"
    },
    html: {
      pattern: '<(\\w+)(\\s[^>]*)?>([\\s\\S]*?)<\\/\\1>|<(\\w+)(\\s[^>]*)?\\/?>',
      flags: { g: true, i: true, m: false, s: true, u: false },
      sample: "HTML \uD0DC\uADF8 \uC608\uC2DC:\n<div class=\"container\">\uB0B4\uC6A9</div>\n<p id=\"intro\">\uC548\uB155\uD558\uC138\uC694</p>\n<img src=\"photo.jpg\" alt=\"\uC0AC\uC9C4\" />\n<br>\n<a href=\"https://example.com\">\uB9C1\uD06C</a>\n<span style=\"color:red\">\uBE68\uAC04 \uAE00\uC790</span>\n\n\uC77C\uBC18 \uD14D\uC2A4\uD2B8:\n\uC774\uAC83\uC740 <\uD0DC\uADF8>\uAC00 \uC544\uB2D9\uB2C8\uB2E4\n\uC218\uD559: 3 < 5 > 2"
    },
  };

  var DEFAULT_SAMPLE = "Hello World! \uC548\uB155\uD558\uC138\uC694.\ntest@email.com, user123@domain.co.kr\n\uC804\uD654\uBC88\uD638: 010-1234-5678, 02-987-6543\nhttps://www.example.com/path?q=search\n2026-02-22, \uAC00\uACA9: 15,000\uC6D0\n<div class=\"test\">HTML \uB0B4\uC6A9</div>\n\nLorem ipsum dolor sit amet, consectetur adipiscing elit.\nThe quick brown fox jumps over the lazy dog.\nabc123 ABC456 def789";

  // ============================================================
  // DOM
  // ============================================================
  function $(sel) { return document.querySelector(sel); }
  function $$(sel) { return Array.prototype.slice.call(document.querySelectorAll(sel)); }

  var dom = {
    regexInput: $('#regexInput'),
    regexError: $('#regexError'),
    sampleText: $('#sampleText'),
    preview: $('#preview'),
    matchCount: $('#matchCount'),
    matchResults: $('#matchResults'),
    explanation: $('#explanation'),
    promptOutput: $('#promptOutput'),
    copyBtn: $('#copyBtn'),
    clearSample: $('#clearSample'),
  };

  // ============================================================
  // CORE
  // ============================================================
  function updateAll() {
    state.pattern = dom.regexInput.value;
    state.sampleText = dom.sampleText.value;

    var flagStr = Object.keys(state.flags)
      .filter(function(k) { return state.flags[k]; })
      .join('');

    state.error = null;
    state.regex = null;
    state.matches = [];

    if (state.pattern) {
      try {
        state.regex = new RegExp(state.pattern, flagStr);
      } catch (e) {
        state.error = e.message;
      }
    }

    if (state.regex && state.sampleText) {
      try {
        var reFlags = flagStr.indexOf('g') >= 0 ? flagStr : flagStr + 'g';
        var re = new RegExp(state.pattern, reFlags);
        var m;
        var safety = 0;
        while ((m = re.exec(state.sampleText)) !== null && safety < 2000) {
          state.matches.push({
            text: m[0],
            index: m.index,
            groups: Array.prototype.slice.call(m, 1),
          });
          if (m[0].length === 0) re.lastIndex++;
          safety++;
        }
      } catch (e) {
        state.error = state.error || e.message;
      }
    }

    renderError();
    renderPreview();
    renderMatchCount();
    renderMatchResults();
    renderExplanation();
    renderPrompt();
  }

  // ============================================================
  // RENDERS
  // ============================================================
  function renderError() {
    if (state.error) {
      dom.regexError.textContent = state.error;
      dom.regexError.classList.add('visible');
    } else {
      dom.regexError.classList.remove('visible');
    }
  }

  function renderPreview() {
    if (!state.sampleText) {
      dom.preview.innerHTML = '<span style="color:var(--text-dim);font-style:italic;">\uC815\uADDC\uC2DD\uACFC \uD14C\uC2A4\uD2B8 \uBB38\uC790\uC5F4\uC744 \uC785\uB825\uD558\uC138\uC694.</span>';
      return;
    }
    if (!state.regex || state.error || state.matches.length === 0) {
      dom.preview.textContent = state.sampleText;
      dom.preview.style.color = '';
      dom.preview.style.fontStyle = '';
      return;
    }

    var text = state.sampleText;
    var segments = [];
    var lastEnd = 0;
    var sorted = state.matches.slice().sort(function(a, b) { return a.index - b.index; });

    for (var si = 0; si < sorted.length; si++) {
      var match = sorted[si];
      if (match.index < lastEnd) continue;
      if (match.index > lastEnd) {
        segments.push({ type: 'text', value: text.slice(lastEnd, match.index) });
      }
      segments.push({ type: 'match', value: match.text, groups: match.groups });
      lastEnd = match.index + match.text.length;
    }
    if (lastEnd < text.length) {
      segments.push({ type: 'text', value: text.slice(lastEnd) });
    }

    var html = '';
    for (var hi = 0; hi < segments.length; hi++) {
      var seg = segments[hi];
      if (seg.type === 'text') {
        html += escapeHtml(seg.value);
      } else {
        html += '<span class="match-hl-0">' + escapeHtml(seg.value) + '</span>';
      }
    }

    dom.preview.innerHTML = html;
    dom.preview.style.color = '';
    dom.preview.style.fontStyle = '';
  }

  function renderMatchCount() {
    var n = state.matches.length;
    dom.matchCount.textContent = n;
    dom.matchCount.className = 'count' + (n === 0 ? ' zero' : '');
  }

  function renderMatchResults() {
    if (state.matches.length === 0) {
      dom.matchResults.innerHTML = '';
      return;
    }

    var MAX_DISPLAY = 100;
    var display = state.matches.slice(0, MAX_DISPLAY);
    var html = '';

    for (var i = 0; i < display.length; i++) {
      var m = display[i];
      html += '<div class="match-item">';
      html += '<span class="mi-index">#' + (i + 1) + '</span>';
      html += '<span class="mi-text">' + escapeHtml(m.text) + '</span>';
      html += '<span class="mi-pos">\uC778\uB371\uC2A4 ' + m.index + '</span>';

      var validGroups = m.groups.filter(function(g) { return g !== undefined; });
      if (validGroups.length > 0) {
        html += '<div class="match-groups">';
        for (var gi = 0; gi < m.groups.length; gi++) {
          if (m.groups[gi] !== undefined) {
            var cls = 'mg-' + Math.min(gi + 1, 5);
            html += '<span class="match-group-tag ' + cls + '">\uADF8\uB8F9' + (gi + 1) + ': ' + escapeHtml(m.groups[gi]) + '</span>';
          }
        }
        html += '</div>';
      }
      html += '</div>';
    }

    if (state.matches.length > MAX_DISPLAY) {
      html += '<div style="text-align:center;color:var(--text-dim);font-size:12px;padding:8px;">... \uC678 ' + (state.matches.length - MAX_DISPLAY) + '\uAC1C \uB9E4\uCE58</div>';
    }

    dom.matchResults.innerHTML = html;
  }

  function renderExplanation() {
    if (!state.pattern) {
      dom.explanation.innerHTML = '<span style="color:var(--text-dim);font-style:italic;">\uD328\uD134\uC744 \uC785\uB825\uD558\uBA74 \uC124\uBA85\uC774 \uD45C\uC2DC\uB429\uB2C8\uB2E4.</span>';
      return;
    }
    if (state.error) {
      dom.explanation.innerHTML = '<span style="color:#ff6b81;">\uC798\uBABB\uB41C \uC815\uADDC\uC2DD: ' + escapeHtml(state.error) + '</span>';
      return;
    }
    dom.explanation.innerHTML = explainRegex(state.pattern);
  }

  function explainRegex(pattern) {
    var tokens = tokenize(pattern);
    if (tokens.length === 0) return '<span style="color:var(--text-dim);">\uBE48 \uD328\uD134</span>';
    return tokens.map(function(t) {
      return '<span class="exp-token">' + escapeHtml(t.raw) + '</span> ' + t.desc;
    }).join('<br>');
  }

  function tokenize(pattern) {
    var tokens = [];
    var i = 0;

    var rules = [
      [/^\\d/, '\uC22B\uC790 (0-9)'],
      [/^\\D/, '\uC22B\uC790\uAC00 \uC544\uB2CC \uBB38\uC790'],
      [/^\\w/, '\uB2E8\uC5B4 \uBB38\uC790 (a-z, A-Z, 0-9, _)'],
      [/^\\W/, '\uB2E8\uC5B4\uAC00 \uC544\uB2CC \uBB38\uC790'],
      [/^\\s/, '\uACF5\uBC31 \uBB38\uC790'],
      [/^\\S/, '\uACF5\uBC31\uC774 \uC544\uB2CC \uBB38\uC790'],
      [/^\\b/, '\uB2E8\uC5B4 \uACBD\uACC4'],
      [/^\\B/, '\uB2E8\uC5B4 \uACBD\uACC4\uAC00 \uC544\uB2CC \uC704\uCE58'],
      [/^\\n/, '\uC904\uBC14\uAFC8'],
      [/^\\t/, '\uD0ED'],
      [/^\\r/, '\uCE90\uB9AC\uC9C0 \uB9AC\uD134'],
      [/^\\\./, '\uB9AC\uD130\uB7F4 \uB9C8\uCE68\uD45C'],
      [/^\\\\/, '\uB9AC\uD130\uB7F4 \uBC31\uC2AC\uB798\uC2DC'],
      [/^\\\(/, '\uB9AC\uD130\uB7F4 ('],
      [/^\\\)/, '\uB9AC\uD130\uB7F4 )'],
      [/^\\\[/, '\uB9AC\uD130\uB7F4 ['],
      [/^\\\]/, '\uB9AC\uD130\uB7F4 ]'],
      [/^\\\{/, '\uB9AC\uD130\uB7F4 {'],
      [/^\\\}/, '\uB9AC\uD130\uB7F4 }'],
      [/^\\\+/, '\uB9AC\uD130\uB7F4 +'],
      [/^\\\*/, '\uB9AC\uD130\uB7F4 *'],
      [/^\\\?/, '\uB9AC\uD130\uB7F4 ?'],
      [/^\\\^/, '\uB9AC\uD130\uB7F4 ^'],
      [/^\\\$/, '\uB9AC\uD130\uB7F4 $'],
      [/^\\\//, '\uB9AC\uD130\uB7F4 /'],
      [/^\\\|/, '\uB9AC\uD130\uB7F4 |'],
      [/^\\(.)/, '_ESCAPE_'],
      [/^\{(\d+),(\d+)\}/, '_RANGE_'],
      [/^\{(\d+),\}/, '_MIN_'],
      [/^\{(\d+)\}/, '_EXACT_'],
      [/^\*\?/, '0\uD68C \uC774\uC0C1 \uBC18\uBCF5 (\uAC8C\uC73C\uB978)'],
      [/^\+\?/, '1\uD68C \uC774\uC0C1 \uBC18\uBCF5 (\uAC8C\uC73C\uB978)'],
      [/^\?\?/, '0 \uB610\uB294 1\uD68C (\uAC8C\uC73C\uB978)'],
      [/^\*/, '0\uD68C \uC774\uC0C1 \uBC18\uBCF5'],
      [/^\+/, '1\uD68C \uC774\uC0C1 \uBC18\uBCF5'],
      [/^\(\?<=/, '\uAE0D\uC815 \uD6C4\uBC29\uD0D0\uC0C9 \uC2DC\uC791'],
      [/^\(\?<!/, '\uBD80\uC815 \uD6C4\uBC29\uD0D0\uC0C9 \uC2DC\uC791'],
      [/^\(\?=/, '\uAE0D\uC815 \uC804\uBC29\uD0D0\uC0C9 \uC2DC\uC791'],
      [/^\(\?!/, '\uBD80\uC815 \uC804\uBC29\uD0D0\uC0C9 \uC2DC\uC791'],
      [/^\(\?:/, '\uBE44\uCEA1\uCC98 \uADF8\uB8F9 \uC2DC\uC791'],
      [/^\(/, '\uCEA1\uCC98 \uADF8\uB8F9 \uC2DC\uC791'],
      [/^\)/, '\uADF8\uB8F9 \uB05D'],
      [/^\[\^([^\]]*)\]/, '_NEGCLASS_'],
      [/^\[([^\]]*)\]/, '_CLASS_'],
      [/^\^/, '\uBB38\uC790\uC5F4/\uC904\uC758 \uC2DC\uC791'],
      [/^\$/, '\uBB38\uC790\uC5F4/\uC904\uC758 \uB05D'],
      [/^\./, '\uBAA8\uB4E0 \uBB38\uC790 (\uC904\uBC14\uAFC8 \uC81C\uC678)'],
      [/^\|/, '\uB610\uB294 (alternation)'],
      [/^\?/, '0 \uB610\uB294 1\uD68C'],
    ];

    while (i < pattern.length) {
      var remaining = pattern.slice(i);
      var matched = false;

      for (var ri = 0; ri < rules.length; ri++) {
        var re = rules[ri][0];
        var descKey = rules[ri][1];
        var m = remaining.match(re);
        if (m) {
          var raw = m[0];
          var desc = descKey;

          if (descKey === '_ESCAPE_') {
            desc = '\uC774\uC2A4\uCF00\uC774\uD504\uB41C "' + m[1] + '"';
          } else if (descKey === '_RANGE_') {
            desc = m[1] + '\uD68C \uC774\uC0C1 ' + m[2] + '\uD68C \uC774\uD558 \uBC18\uBCF5';
          } else if (descKey === '_MIN_') {
            desc = m[1] + '\uD68C \uC774\uC0C1 \uBC18\uBCF5';
          } else if (descKey === '_EXACT_') {
            desc = '\uC815\uD655\uD788 ' + m[1] + '\uD68C \uBC18\uBCF5';
          } else if (descKey === '_NEGCLASS_') {
            desc = '"' + m[1] + '" \uC5D0 \uD3EC\uD568\uB418\uC9C0 \uC54A\uB294 \uBB38\uC790';
          } else if (descKey === '_CLASS_') {
            desc = '"' + m[1] + '" \uC911 \uD558\uB098';
          }

          tokens.push({ raw: raw, desc: desc });
          i += m[0].length;
          matched = true;
          break;
        }
      }

      if (!matched) {
        var ch = pattern[i];
        tokens.push({ raw: ch, desc: '\uB9AC\uD130\uB7F4 "' + ch + '"' });
        i++;
      }
    }

    return tokens;
  }

  function renderPrompt() {
    if (!state.pattern || state.error) {
      dom.promptOutput.innerHTML = '<span style="color:var(--text-dim);font-style:italic;">\uC815\uADDC\uC2DD\uC774 \uC644\uC131\uB418\uBA74 \uC790\uC5F0\uC5B4 \uD504\uB86C\uD504\uD2B8\uAC00 \uC0DD\uC131\uB429\uB2C8\uB2E4.</span>';
      return;
    }

    var flagStr = Object.keys(state.flags)
      .filter(function(k) { return state.flags[k]; })
      .join('');

    var flagDescs = [];
    if (state.flags.g) flagDescs.push('globally (all occurrences)');
    if (state.flags.i) flagDescs.push('case-insensitively');
    if (state.flags.m) flagDescs.push('in multiline mode');
    if (state.flags.s) flagDescs.push('with dotAll (. matches newlines)');
    if (state.flags.u) flagDescs.push('with Unicode support');

    var desc = generatePromptDescription(state.pattern);
    var flagPart = flagDescs.length > 0 ? ' ' + flagDescs.join(', ') + '.' : '.';

    var groupCount = countCaptureGroups(state.pattern);
    var groupPart = groupCount > 0
      ? ' The pattern should have ' + groupCount + ' capture group' + (groupCount > 1 ? 's' : '') + '.'
      : '';

    var prompt = 'Write a regex that ' + desc + flagPart + groupPart + '\n\nRegex: /' + state.pattern + '/' + flagStr;

    dom.promptOutput.textContent = prompt;
    dom.promptOutput.style.color = '';
    dom.promptOutput.style.fontStyle = '';
  }

  function generatePromptDescription(pattern) {
    var presetDescs = {
      email: 'matches email addresses in the format user@domain.tld, capturing the username and domain separately',
      phone: 'matches Korean phone numbers in formats like 010-1234-5678, 02-123-4567, or without separators, capturing the area code, middle digits, and last 4 digits',
      url: 'matches URLs with http/https protocol, capturing the protocol, domain, path, and optional query parameters',
      date: 'matches dates in formats like YYYY-MM-DD, YYYY.MM.DD, YYYY/MM/DD, or DD/MM/YYYY, DD.MM.YYYY with various separators',
      html: 'matches HTML tags including self-closing tags, capturing the tag name, attributes, and inner content',
    };

    for (var key in PRESETS) {
      if (pattern === PRESETS[key].pattern && presetDescs[key]) {
        return presetDescs[key];
      }
    }

    var parts = [];
    if (/\\d/.test(pattern)) parts.push('digits');
    if (/\\w/.test(pattern)) parts.push('word characters');
    if (/\\s/.test(pattern)) parts.push('whitespace');
    if (/@/.test(pattern)) parts.push('email-like patterns');
    if (/https?/.test(pattern)) parts.push('URLs');
    if (/\\b/.test(pattern)) parts.push('word boundaries');

    if (parts.length > 0) {
      return 'matches patterns containing ' + parts.join(', ');
    }

    return 'matches the pattern /' + pattern + '/';
  }

  function countCaptureGroups(pattern) {
    var count = 0;
    var i = 0;
    while (i < pattern.length) {
      if (pattern[i] === '\\') { i += 2; continue; }
      if (pattern[i] === '(' && pattern[i + 1] !== '?') { count++; }
      i++;
    }
    return count;
  }

  // ============================================================
  // UTILITY
  // ============================================================
  function escapeHtml(str) {
    return str
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // ============================================================
  // EVENTS
  // ============================================================
  dom.regexInput.addEventListener('input', updateAll);
  dom.sampleText.addEventListener('input', updateAll);

  $$('.flag-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      var flag = btn.dataset.flag;
      state.flags[flag] = !state.flags[flag];
      btn.classList.toggle('active', state.flags[flag]);
      updateAll();
    });
  });

  $$('.block-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      var insert = btn.dataset.insert;
      var cursorOffset = btn.dataset.cursor ? parseInt(btn.dataset.cursor) : 0;
      var input = dom.regexInput;
      var start = input.selectionStart;
      var end = input.selectionEnd;
      var before = input.value.slice(0, start);
      var after = input.value.slice(end);
      input.value = before + insert + after;
      var newPos = start + insert.length + cursorOffset;
      input.setSelectionRange(newPos, newPos);
      input.focus();
      updateAll();
    });
  });

  $$('.preset-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      var preset = PRESETS[btn.dataset.preset];
      if (!preset) return;
      dom.regexInput.value = preset.pattern;
      dom.sampleText.value = preset.sample;
      for (var flag in preset.flags) {
        state.flags[flag] = preset.flags[flag];
      }
      $$('.flag-btn').forEach(function(fb) {
        fb.classList.toggle('active', state.flags[fb.dataset.flag]);
      });
      updateAll();
      dom.regexInput.focus();
    });
  });

  dom.clearSample.addEventListener('click', function() {
    dom.sampleText.value = DEFAULT_SAMPLE;
    updateAll();
  });

  dom.copyBtn.addEventListener('click', function() {
    var text = dom.promptOutput.textContent;
    if (!text || dom.promptOutput.querySelector('span')) return;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function() {
        showCopied();
      }).catch(function() {
        fallbackCopy(text);
      });
    } else {
      fallbackCopy(text);
    }
  });

  function showCopied() {
    dom.copyBtn.textContent = '\uBCF5\uC0AC\uB428!';
    dom.copyBtn.classList.add('copied');
    setTimeout(function() {
      dom.copyBtn.textContent = '\uBCF5\uC0AC';
      dom.copyBtn.classList.remove('copied');
    }, 1500);
  }

  function fallbackCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch(e) {}
    document.body.removeChild(ta);
    showCopied();
  }

  // ============================================================
  // INIT
  // ============================================================
  dom.sampleText.value = DEFAULT_SAMPLE;
  updateAll();

})();
</script>
</body>
</html>
